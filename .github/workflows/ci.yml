name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Checkout the event commit in both jobs. A PR merge ref can disappear while
# queued runs start, and a base branch can advance after the merge event.
jobs:
  backend:
    name: Backend vet, build, and test
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOWORK: 'off'

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
            tokenkit/go.sum

      - name: Create frontend embed placeholder
        run: |
          mkdir -p web/dist
          touch web/dist/index.html

      - name: Vet root module
        run: go vet ./...

      - name: Vet relaykit independently
        working-directory: relaykit
        run: go vet ./...

      - name: Vet tokenkit independently
        working-directory: tokenkit
        run: go vet ./...

      - name: Build root module
        run: go build ./...

      - name: Build relaykit independently
        working-directory: relaykit
        run: go build ./...

      - name: Build tokenkit independently
        working-directory: tokenkit
        run: go build ./...

      - name: Test root, relaykit, and tokenkit modules
        run: make test

  frontend:
    name: Frontend typecheck, test, and production build
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.base.repo.full_name || github.repository }}
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint changed frontend files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          base = os.environ.get('BASE_SHA', '')
          if not base or set(base) == {'0'}:
              base = subprocess.check_output(['git', 'rev-parse', 'HEAD^'], text=True).strip()
          names = subprocess.check_output(['git', 'diff', '--name-only', '-z', base, 'HEAD', '--', 'web/'], cwd='..').decode().split('\0')
          files = [name.removeprefix('web/') for name in names if name.startswith('web/') and pathlib.Path(name.removeprefix('web/')).is_file() and pathlib.Path(name).suffix in {'.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs'}]
          if files:
              subprocess.run(['bun', 'x', 'oxlint', '-c', '.oxlintrc.json', '--', *files], check=True)
          PY

      - name: Test
        run: bun run test

      - name: Verify bundle-budget guard
        run: node --test scripts/__tests__/check-initial-bundle.test.mjs

      - name: Production build
        run: bun run build

      - name: Check initial asset budget
        run: bun scripts/check-initial-bundle.mjs --max-gzip=1100000 --output="$RUNNER_TEMP/frontend-bundle.json"

      - name: Upload frontend asset measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-bundle-budget
          path: ${{ runner.temp }}/frontend-bundle.json
          if-no-files-found: ignore

  database:
    name: Real database migrations and feature contracts
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-test-password-not-production
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s --health-timeout=5s --health-retries=15
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-test-password-not-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      GOWORK: 'off'
      MYSQL_PWD: ci-test-password-not-production
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: ci-test-password-not-production
      TEST_MYSQL_DSN: root:ci-test-password-not-production@tcp(127.0.0.1:3306)/new_api_ci_behavior?charset=utf8mb4&parseTime=true
      TEST_MYSQL_FRESH_DSN: root:ci-test-password-not-production@tcp(127.0.0.1:3306)/new_api_ci_fresh?charset=utf8mb4&parseTime=true
      TEST_MYSQL_UPGRADE_DSN: root:ci-test-password-not-production@tcp(127.0.0.1:3306)/new_api_ci_upgrade?charset=utf8mb4&parseTime=true
      TEST_POSTGRES_DSN: postgres://postgres:ci-test-password-not-production@127.0.0.1:5432/new_api_ci_behavior?sslmode=disable
      TEST_POSTGRES_FRESH_DSN: postgres://postgres:ci-test-password-not-production@127.0.0.1:5432/new_api_ci_fresh?sslmode=disable
      TEST_POSTGRES_UPGRADE_DSN: postgres://postgres:ci-test-password-not-production@127.0.0.1:5432/new_api_ci_upgrade?sslmode=disable
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Check out published migration baseline
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: QuantumNous/new-api
          ref: 7d8b91268dab69d7150f345c448b5e250163146a # v1.0.0-rc.46
          path: .ci-baseline
      - name: Check out the customized P0 migration baseline
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: heiyuan0801/newapi
          ref: 9588ab6e712ef5186f0a81bd964534f7eae4c2a3
          path: .ci-p0-baseline
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Install native database clients
        run: sudo apt-get update && sudo apt-get install -y mysql-client postgresql-client
      - name: Prepare API-only embed for the recovery drill
        run: |
          mkdir -p web/dist
          touch web/dist/index.html
      - name: Create dedicated disposable databases
        run: |
          for name in new_api_ci_behavior new_api_ci_fresh new_api_ci_upgrade new_api_ci_custom_fresh new_api_ci_custom_upgrade; do
            mysql -h 127.0.0.1 -u root -e "CREATE DATABASE $name CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
            createdb "$name"
          done
      - name: Verify all three database migrations
        run: |
          for engine in sqlite mysql postgres; do
            python3 tools/dbcheck/run.py --engine "$engine" --baseline-root .ci-baseline --output "$RUNNER_TEMP/dbcheck/$engine"
          done
      - name: Verify customized P0 upgrades on all three databases
        env:
          TEST_MYSQL_FRESH_DSN: root:ci-test-password-not-production@tcp(127.0.0.1:3306)/new_api_ci_custom_fresh?charset=utf8mb4&parseTime=true
          TEST_MYSQL_UPGRADE_DSN: root:ci-test-password-not-production@tcp(127.0.0.1:3306)/new_api_ci_custom_upgrade?charset=utf8mb4&parseTime=true
          TEST_POSTGRES_FRESH_DSN: postgres://postgres:ci-test-password-not-production@127.0.0.1:5432/new_api_ci_custom_fresh?sslmode=disable
          TEST_POSTGRES_UPGRADE_DSN: postgres://postgres:ci-test-password-not-production@127.0.0.1:5432/new_api_ci_custom_upgrade?sslmode=disable
        run: |
          for engine in sqlite mysql postgres; do
            python3 tools/dbcheck/run.py --engine "$engine" --baseline-root .ci-p0-baseline --baseline-ref 9588ab6e712ef5186f0a81bd964534f7eae4c2a3 --baseline-tag P0-9588ab6e7 --output "$RUNNER_TEMP/dbcheck/p0-$engine"
          done
      - name: Verify database-dependent feature behavior without skipped engines
        run: |
          verify_feature() {
            local log_file="$RUNNER_TEMP/feature-$1.log"
            shift
            if "$@" > "$log_file" 2>&1; then
              cat "$log_file"
            else
              cat "$log_file"
              python3 - "$log_file" <<'PY'
          import pathlib, re, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()
          selected = set()
          for index, line in enumerate(lines):
              if re.search(r'--- FAIL:|Error Trace:|Error:|panic:|signal:|^FAIL', line):
                  selected.update(range(max(0, index - 2), min(len(lines), index + 12)))
          excerpt = '\n'.join(lines[index] for index in sorted(selected)) if selected else '\n'.join(lines[-60:])
          excerpt = excerpt[:24000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Database feature test failure::{excerpt}')
          PY
              return 1
            fi
          }
          verify_feature model go test ./model -run 'TestTokenBudgetDatabaseMatrix' -count=1 -v
          verify_feature controller go test ./controller -run 'TestAvailabilityPersistenceDatabaseMatrix|TestAvailabilityDiagnosticsPrivilegesAndAggregation|TestSupportTicketWorkflowDatabaseMatrix|TestWalletReportsDatabaseMatrix|TestMonthlyWalletExportGuards' -count=1 -v
          verify_feature service go test ./service -run 'TestNotificationDeliveryDatabaseMatrix|TestNotificationHTTPTransportHonorsCancellation' -count=1 -race -v
      - name: Recovery tool tests and real database restore drill
        run: |
          python3 -m unittest discover -s tools/ops -p 'test_*.py' -v
          python3 tools/ops/drill.py --output "$RUNNER_TEMP/recovery-drill"
      - name: Upload non-secret validation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-and-recovery-results
          path: |
            ${{ runner.temp }}/dbcheck/*/result.json
            ${{ runner.temp }}/recovery-drill/result.json
            ${{ runner.temp }}/feature-*.log
          if-no-files-found: ignore
